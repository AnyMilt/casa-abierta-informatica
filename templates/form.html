<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Abierta - Informática</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container-fluid py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <div class="card shadow">
          <div class="card-header bg-primary text-white text-center">
            <div class="d-flex align-items-center justify-content-center mb-2">
              <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="me-3" style="height: 50px;">
              <h3 class="mb-0">Casa Abierta - Informática</h3>
            </div>
            <p class="mb-0 opacity-75">Registro y Cuestionario de Participación</p>
          </div>
          <div class="card-body">
            <form method="post">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" id="correo" name="correo" class="form-control">
              </div>
              <div class="mb-3">
                <label for="institucion" class="form-label">Institución</label>
                <input type="text" id="institucion" name="institucion" class="form-control" required>
              </div>
              <hr>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="text-primary mb-0">Cuestionario</h5>
                <div class="progress" style="width: 200px;">
                  <div class="progress-bar bg-primary" role="progressbar" style="width: 0%" id="progressBar"></div>
                </div>
                <small class="text-muted" id="progressText">0/3</small>
              </div>
              {% for key, (pregunta, opciones, _) in preguntas.items() %}
                <div class="mb-3">
                  <label class="form-label">{{ loop.index }}. {{ pregunta }}</label>
                  {% for opcion in opciones %}
                    {% set j = ['a', 'b', 'c', 'd'][loop.index0] %}
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="{{ key }}" value="{{ j }}" id="{{ key }}_{{ j }}" required>
                      <label class="form-check-label" for="{{ key }}_{{ j }}">{{ opcion }}</label>
                    </div>
                  {% endfor %}
                </div>
              {% endfor %}
              <div class="text-center">
                <button type="submit" class="btn btn-custom w-100 w-md-auto px-4" id="submitBtn">
                  <span id="btnText">Enviar y generar certificado</span>
                  <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Actualizar progreso del cuestionario
    function updateProgress() {
      const radioButtons = document.querySelectorAll('input[type="radio"]');
      const answeredQuestions = new Set();
      
      radioButtons.forEach(radio => {
        if (radio.checked) {
          answeredQuestions.add(radio.name);
        }
      });
      
      const progress = (answeredQuestions.size / 3) * 100;
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      
      progressBar.style.width = progress + '%';
      progressText.textContent = `${answeredQuestions.size}/3`;
      
      // Cambiar color según progreso
      if (progress === 100) {
        progressBar.classList.remove('bg-primary');
        progressBar.classList.add('bg-success');
      } else {
        progressBar.classList.remove('bg-success');
        progressBar.classList.add('bg-primary');
      }
    }
    
    // Agregar listeners a todos los radio buttons
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', updateProgress);
    });
    
    // Mostrar spinner al enviar formulario
    document.querySelector('form').addEventListener('submit', function() {
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      
      submitBtn.disabled = true;
      btnText.textContent = 'Procesando...';
      btnSpinner.classList.remove('d-none');
    });
    
    // Inicializar progreso
    updateProgress();
  </script>
</body>
</html>
